<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YouTube → MP3</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#111;color:#eee;font-family:Arial,sans-serif}.box{width:min(650px,100%);padding:32px;border:1px solid #333;border-radius:14px;background:#1b1b1b}h1{text-align:center;margin-top:0}p{text-align:center;color:#aaa}form{display:flex;gap:10px;margin-top:26px}input{flex:1;min-width:0;padding:14px;border:1px solid #444;border-radius:8px;background:#111;color:#eee;font-size:16px}button{padding:14px 22px;border:0;border-radius:8px;background:#eee;color:#111;font-weight:bold;cursor:pointer}button:disabled{cursor:wait;opacity:.6}.error{margin-top:20px;padding:12px;border-radius:8px;background:#401b1b;color:#ffb5b5}@media(max-width:600px){form{flex-direction:column}button{width:100%}}
</style>
</head>
<body>
<main class="box">
<h1>YouTube → MP3</h1>
<p>Enter a YouTube URL and convert the audio to an MP3.</p>

<form id="convert-form" method="post">
<input id="url" type="url" name="url" placeholder="https://www.youtube.com/watch?v=..." required autocomplete="off">
<button id="convert-button" type="submit">Convert</button>
</form>

<div id="error-container"></div>

<p>Temporary files are automatically deleted after 10 minutes.</p>
</main>

<script>
const form = document.getElementById("convert-form");
const urlInput = document.getElementById("url");
const button = document.getElementById("convert-button");
const errorContainer = document.getElementById("error-container");

form.addEventListener("submit", async (event) => {
    event.preventDefault();

    errorContainer.innerHTML = "";
    button.disabled = true;
    button.textContent = "Converting...";

    try {
        const response = await fetch("/", {
            method: "POST",
            body: new FormData(form)
        });

        if (!response.ok) {
            const html = await response.text();
            const parser = new DOMParser();
            const document = parser.parseFromString(html, "text/html");
            const error = document.querySelector(".error");

            if (error) {
                errorContainer.innerHTML = error.outerHTML;
            } else {
                errorContainer.innerHTML =
                    '<div class="error">Conversion failed.</div>';
            }

            return;
        }

        const blob = await response.blob();

        const disposition = response.headers.get("Content-Disposition");
        let filename = "audio.mp3";

        if (disposition) {
            const match = disposition.match(/filename="([^"]+)"/);
            if (match) {
                filename = match[1];
            }
        }

        const downloadUrl = URL.createObjectURL(blob);
        const downloadLink = document.createElement("a");

        downloadLink.href = downloadUrl;
        downloadLink.download = filename;
        document.body.appendChild(downloadLink);
        downloadLink.click();
        downloadLink.remove();

        URL.revokeObjectURL(downloadUrl);

        urlInput.value = "";
        window.history.replaceState({}, "", "/");

    } catch (error) {
        errorContainer.innerHTML =
            '<div class="error">Unable to contact the server.</div>';
    } finally {
        button.disabled = false;
        button.textContent = "Convert";
    }
});
</script>

</body>
</html>
