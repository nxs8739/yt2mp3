<!doctype html>

<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>YouTube → MP3</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #0d1117;
            --panel: #161b22;
            --border: #30363d;
            --text: #e6edf3;
            --muted: #8b949e;
            --accent: #58a6ff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .box {
            width: min(680px, 100%);
            padding: 28px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: var(--panel);
        }

        h1 {
            text-align: center;
            margin: 0 0 8px;
        }

        p {
            text-align: center;
            margin: 0 0 24px;
            color: var(--muted);
        }

        form {
            display: flex;
            gap: 8px;
            margin-top: 26px;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 13px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg);
            color: var(--text);
            font-size: 1rem;
            outline: none;
        }

        input:focus {
            border-color: var(--accent);
        }

        button {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 14px;
            background: #21262d;
            color: var(--text);
            cursor: pointer;
            font-weight: 600;
        }

        button:hover {
            background: #30363d;
        }

        button:disabled {
            cursor: wait;
            opacity: .6;
        }

        .error {
            margin-top: 20px;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #401b1b;
            color: #ffb5b5;
        }

        @media (max-width: 600px) {
            form {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <main class="box">
        <h1>YouTube → MP3</h1>

        <p>
            Enter a YouTube URL and convert the audio to an MP3.
        </p>

        <form id="convert-form" method="post">
            <input id="url" type="url" name="url" placeholder="https://www.youtube.com/watch?v=..." required autocomplete="off">
            <button id="convert-button" type="submit">Convert</button>
        </form>

        <div id="error-container"></div>

    </main>

    <script>
        const form = document.getElementById("convert-form");
        const urlInput = document.getElementById("url");
        const button = document.getElementById("convert-button");
        const errorContainer = document.getElementById("error-container");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            errorContainer.innerHTML = "";
            button.disabled = true;
            button.textContent = "Converting...";

            try {
                const response = await fetch("/", {
                    method: "POST",
                    body: new FormData(form)
                });

                if (!response.ok) {
                    const html = await response.text();
                    const parser = new DOMParser();
                    const document = parser.parseFromString(html, "text/html");
                    const error = document.querySelector(".error");

                    if (error) {
                        errorContainer.innerHTML = error.outerHTML;
                    } else {
                        errorContainer.innerHTML =
                            '<div class="error">Conversion failed.</div>';
                    }

                    return;
                }

                const blob = await response.blob();

                const disposition = response.headers.get("Content-Disposition");
                let filename = "audio.mp3";

                if (disposition) {
                    const match = disposition.match(/filename="([^"]+)"/);
                    if (match) {
                        filename = match[1];
                    }
                }

                const downloadUrl = URL.createObjectURL(blob);
                const downloadLink = document.createElement("a");

                downloadLink.href = downloadUrl;
                downloadLink.download = filename;
                document.body.appendChild(downloadLink);
                downloadLink.click();
                downloadLink.remove();

                URL.revokeObjectURL(downloadUrl);

                urlInput.value = "";
                window.history.replaceState({}, "", "/");

            } catch (error) {
                errorContainer.innerHTML =
                    '<div class="error">Unable to contact the server.</div>';
            } finally {
                button.disabled = false;
                button.textContent = "Convert";
            }
        });
    </script>

</body>

</html>
